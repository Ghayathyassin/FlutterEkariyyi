plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

// Release signing config, loaded from android/key.properties (git-ignored, NOT
// committed). When the file is absent (dev machines / CI without the keystore),
// the release build falls back to debug signing so `flutter run` still works.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace = "com.example.flutter_application_1"
    // Pinned to 35 (Android 15) rather than flutter.compileSdkVersion, which on
    // Flutter 3.24 still resolves to 34 — below the level Google Play accepts
    // for new uploads. Revisit when the Flutter SDK is upgraded.
    compileSdk = 35
    // Pinned: several plugins (flutter_local_notifications, path_provider,
    // shared_preferences, sqflite, url_launcher, integration_test) require
    // 26.1.10909125, which is higher than flutter.ndkVersion on Flutter 3.24.
    ndkVersion = "26.1.10909125"

    compileOptions {
        // Required by flutter_local_notifications (uses java.time APIs).
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        // Production application ID (reverse of the LRC domain lrc.gov.lb).
        // This is the app's permanent identity in Firebase and the Play Store.
        applicationId = "lb.gov.lrc.ekariyyi"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = flutter.minSdkVersion
        // Pinned to 35 for the same reason as compileSdk above. NOTE: targeting
        // 35 makes Android 15 force edge-to-edge and ignore statusBarColor, so
        // the status-bar tint is painted by the app itself (see CustomAppBar).
        targetSdk = 35
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // Production builds use the release keystore (key.properties present);
            // dev machines without it fall back to debug signing.
            signingConfig = keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
            // R8 code shrinking + resource shrinking. Keep rules for the
            // reflection-using plugins live in proguard-rules.pro.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // 2.x (D8/L8 spec format 200) is required by AGP 8.1+.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'
}
